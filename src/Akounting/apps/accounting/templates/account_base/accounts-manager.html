{% extends 'base.html' %}
{% load static %}

{% block header %}
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/jstree/3.3.12/themes/default/style.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jstree/3.3.12/jstree.min.js"></script>
<style>
    #default-accounts_tree .jstree-anchor {
        align-items: center;
        display: inline-flex;
        min-height: 36px;
        min-width: min(100%, 320px);
    }

    #default-accounts_tree .account-node-actions {
        display: inline-flex;
        gap: .15rem;
        margin-inline-start: .4rem;
    }

    #default-accounts_tree .account-node-action {
        align-items: center;
        display: inline-flex;
        justify-content: center;
        min-height: 32px;
        min-width: 32px;
        padding: .2rem;
    }

    #default-accounts_tree .account-move-source {
        background: #fff3cd;
        border: 2px solid #f0ad4e;
        border-radius: .35rem;
    }

    .account-move-dialog {
        align-items: flex-end;
        background: rgba(15, 23, 42, .5);
        display: flex;
        inset: 0;
        justify-content: center;
        padding: 1rem;
        position: fixed;
        z-index: 1045;
    }

    .account-move-dialog[hidden] {
        display: none !important;
    }

    .account-move-panel [hidden] {
        display: none !important;
    }

    .account-move-panel {
        background: var(--bs-body-bg, #fff);
        border-radius: 1rem 1rem .5rem .5rem;
        box-shadow: 0 1rem 3rem rgba(15, 23, 42, .25);
        max-height: min(86vh, 720px);
        max-width: 680px;
        overflow: auto;
        padding: 1rem;
        width: 100%;
    }

    .account-move-results {
        display: grid;
        gap: .5rem;
        margin-top: .75rem;
        max-height: 42vh;
        overflow-y: auto;
    }

    .account-move-result {
        background: var(--bs-body-bg, #fff);
        border: 1px solid var(--bs-border-color, #dee2e6);
        border-radius: .6rem;
        color: inherit;
        min-height: 58px;
        padding: .55rem .7rem;
        text-align: right;
        width: 100%;
    }

    .account-move-result.is-selected {
        background: rgba(13, 110, 253, .08);
        border-color: #0d6efd;
    }

    .account-move-result-path {
        color: var(--bs-secondary-color, #6c757d);
        display: block;
        font-size: .8rem;
        margin-top: .2rem;
        overflow-wrap: anywhere;
    }

    .account-move-positions {
        background: rgba(13, 110, 253, .05);
        border: 1px solid rgba(13, 110, 253, .2);
        border-radius: .75rem;
        margin-top: 1rem;
        padding: .75rem;
    }

    .account-move-position-grid {
        display: grid;
        gap: .5rem;
        grid-template-columns: repeat(3, minmax(0, 1fr));
    }

    @media (hover: hover) and (pointer: fine) {
        #default-accounts_tree .btn-move-account {
            display: none;
        }

        #default-accounts_tree .jstree-anchor {
            cursor: grab;
        }

        #default-accounts_tree .jstree-anchor:active {
            cursor: grabbing;
        }
    }

    @media (max-width: 767.98px), (hover: none), (pointer: coarse) {
        #default-accounts_tree .jstree-anchor {
            min-height: 44px;
        }

        #default-accounts_tree .account-node-action {
            min-height: 44px;
            min-width: 44px;
        }

        .account-move-position-grid {
            grid-template-columns: 1fr;
        }
    }
</style>
{% endblock %}

{% block body %}
<div id="accounts-manager-config"
     data-list-url="{% url 'get_accounts_list' %}"
     data-create-url="{% url 'create_accounts' %}"
     data-edit-url-template="{% url 'edit_account' pk=0 %}"
     data-delete-url-template="{% url 'delete_account' pk=0 %}"
     data-move-url-template="{% url 'move_account' pk=0 %}">
    {% csrf_token %}
    <div id="accounts-report"></div>
</div>

<div id="account-move-dialog" class="account-move-dialog" hidden aria-hidden="true">
    <section class="account-move-panel" role="dialog" aria-modal="true" aria-labelledby="account-move-title">
        <div class="d-flex align-items-start justify-content-between gap-2 mb-3">
            <div>
                <h5 id="account-move-title" class="mb-1">جابجایی حساب</h5>
                <div id="account-move-source-label" class="small text-muted"></div>
            </div>
            <button type="button" class="btn btn-sm btn-outline-secondary account-move-close" aria-label="بستن">✕</button>
        </div>

        <label for="account-move-search" class="form-label">جست‌وجوی حساب مقصد</label>
        <input type="search" id="account-move-search" class="form-control"
               placeholder="نام حساب یا یکی از والدها را بنویسید..." autocomplete="off">

        <div id="account-move-results" class="account-move-results" aria-live="polite"></div>

        <div id="account-move-positions" class="account-move-positions" hidden>
            <div id="account-move-target-label" class="fw-semibold mb-2"></div>
            <div class="account-move-position-grid">
                <button type="button" class="btn btn-primary account-move-position" data-relation="inside">
                    زیرمجموعه مقصد
                </button>
                <button type="button" class="btn btn-outline-primary account-move-position" data-relation="before">
                    قبل از مقصد
                </button>
                <button type="button" class="btn btn-outline-primary account-move-position" data-relation="after">
                    بعد از مقصد
                </button>
                <button type="button" class="btn btn-primary account-move-position account-move-root-position"
                        data-relation="root" hidden>
                    انتهای سطح اصلی
                </button>
            </div>
        </div>
    </section>
</div>

<script src="{% static 'js/form/accounts-manager.js' %}"></script>
{% endblock %}

<div class="modal-body">
    <div class="row">
        {% for img in images %}
            <div class="col-4 mb-2">
                <img src="{{ img.file.url }}"
                     class="img-thumbnail selectable-image"
                     data-id="{{ img.id }}">
            </div>
        {% endfor %}
    </div>

    <hr>

    <div>
        {% csrf_token %}
        <input id="uploadImageForm" type="file" name="file" required>
    </div>
</div>
